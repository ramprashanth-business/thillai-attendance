<script>
var S={entries:[],workers:[],notes:[]},sb=null,user=null,loginMsg="",ready=0,dbErr=0,tab="home",date=today(),month=today().slice(0,7),wdet=null,q="",pq="",sq="",wq="",CB=null,f=newF(),COL=["#7c3aed","#ec4899","#f59e0b","#10b981","#3b82f6","#ef4444"],VAL={H:.5,M:1,N:1},LB={H:"½ Day",M:"☀️ Morning",N:"🌙 Night"},KS=["H","M","N"];
function newF(){return{id:null,hall:"",sel:{}}}
function ymd(d){var p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function today(){return ymd(new Date())}
function dt(s){return new Date(s+"T00:00:00")}
function fmt(d){var a=d.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function sd(d){return dt(d).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function ml(m){return dt(m+"-01").toLocaleDateString("en-IN",{month:"long",year:"numeric"})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function inr(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function fd(n){return Number.isInteger(n)?n:n.toFixed(1)}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1800)}
function col(n){var c=0;for(var i=0;i<n.length;i++)c+=n.charCodeAt(i);return COL[c%COL.length]}
function av(n){return '<div class="av" style="background:'+col(n)+'">'+esc(n.charAt(0).toUpperCase())+'</div>'}
function wk(n){return S.workers.filter(function(x){return x.name===n})[0]}
function rate(n,t){var w=wk(n);if(!w)return 0;var g=t.indexOf("G")>-1,m=t.indexOf("M")>-1;return g&&m?Math.max(w.wg,w.wm):g?w.wg:m?w.wm:0}
function etype(e){return e.t||(/godown/i.test(e.venue)?"G":"M")}
function ti(t){return t==="GM"?"🏭 Godown + 🏛️ Mahal":t==="G"?"🏭 Godown":"🏛️ Mahal"}
function hallOf(e){var t=etype(e);return t==="GM"?e.venue.replace(/^Godown \+ /,""):t==="M"?e.venue:""}
function dys(s){return (s||[]).reduce(function(n,k){return n+(VAL[k]||0)},0)}
function lbl(s){return KS.filter(function(k){return (s||[]).indexOf(k)>-1}).map(function(k){return LB[k]}).join(" + ")}
function ents(d){return S.entries.filter(function(e){return e.date===d})}
function pl(p){return p==="GM"?"🏭🏛️":p==="G"?"🏭":"🏛️"}
function wdesc(x){return x.h>0?fd(Number(x.h))+" h":lbl(x.s)}
function wpay(e,x){var w=wk(x.n);if(x.h>0)return (w?w.wh:0)*x.h;return rate(x.n,x.p||etype(e))*dys(x.s)}
function ePay(e){return e.workers.reduce(function(n,x){return n+wpay(e,x)},0)}
function nt(d,wid){return S.notes.filter(function(x){return x.date===d&&x.wid===wid})[0]||{advance:0,note:""}}
function nline(x){return '<div class="nt">💬 <b>'+esc(x.name)+'</b>'+(x.advance?' · '+inr(x.advance)+' given':'')+(x.note?' · '+esc(x.note):'')+'</div>'}
function notesHTML(d){return S.notes.filter(function(x){return x.date===d&&(x.advance||x.note)}).map(nline).join("")}
function nTxt(d){var l=S.notes.filter(function(x){return x.date===d&&(x.advance||x.note)});return l.length?"\n\nNotes:\n"+l.map(function(x){return "• "+x.name+(x.advance?": "+inr(x.advance)+" given":"")+(x.note?" – "+x.note:"")}).join("\n"):""}
function dayText(d){var l=ents(d);return "Attendance "+fmt(d)+"\n\n"+l.map(function(e,i){return (i+1)+") "+ti(etype(e))+" – "+e.venue+"\n"+e.workers.map(function(w){return "• "+w.n+" "+pl(w.p||etype(e))+" – "+wdesc(w)+" = "+inr(wpay(e,w))}).join("\n")}).join("\n\n")+nTxt(d)+"\n\nTotal: "+inr(l.reduce(function(n,e){return n+ePay(e)},0))}
function send(t){if(navigator.share){navigator.share({text:t}).catch(function(){})}else{try{navigator.clipboard.writeText(t);toast("Copied")}catch(e){prompt("Copy:",t)}}}
function csvCell(v){var x=String(v==null?"":v);return '"'+x.replace(/"/g,'""')+'"'}
function downloadCSV(name,rows){if(!rows.length){toast("No data to export");return}var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(",")}).join("\r\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast("CSV downloaded")}
function exportSalary(){var rows=[["Month","Worker","Role","Days","Hours","Gross salary (INR)","Advance (INR)","Net payable (INR)","Notes"]];S.workers.forEach(function(w){var s=wstat(w,month);if(!s.rows.length&&!s.nts.length)return;var adv=s.nts.reduce(function(n,x){return n+(Number(x.advance)||0)},0),notes=s.nts.map(function(x){return x.date+": "+(x.note||"")}).filter(Boolean).join(" | ");rows.push([month,w.name,w.role||"",fd(s.days),fd(s.hrs),s.pay,adv,s.pay-adv,notes])});downloadCSV("salary-"+month+".csv",rows)}
function exportAttendance(){var rows=[["Date","Worker","Role","Venue","Place","Shift","Hours","Rate salary (INR)","Advance (INR)","Note"]];S.entries.filter(function(e){return e.date.slice(0,7)===month}).forEach(function(e){e.workers.forEach(function(x){var w=wk(x.n),n=w?nt(e.date,w.id):{advance:0,note:""};rows.push([e.date,x.n,w?w.role:"",e.venue,x.p||etype(e),x.h>0?"Hourly":lbl(x.s),x.h||"",wpay(e,x),n.advance||0,n.note||""])})});downloadCSV("attendance-"+month+".csv",rows)}
function openM(h,c){document.getElementById("md").innerHTML='<div class="ov" onclick="closeM()"></div><div class="sheet'+(c?' '+c:'')+'">'+h+'</div>'}
function closeM(){document.getElementById("md").innerHTML="";if(tab==="add")render()}
function confirmM(msg,label,fn){CB=fn;openM('<h2>'+esc(msg)+'</h2><div class="r2"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn red" onclick="var c=CB;closeM();c()">'+label+'</button></div>')}
function hdr(t,s){return '<div class="gr"><div><p>'+s+'</p><h1>'+t+'</h1></div></div>'}
function stt(){return dbErr?'⚠️ Cannot reach database':ready<7?'⏳ Loading…':'☁️ Synced'}
function entryHTML(e,acts){var t=etype(e);return '<div class="ent"><div class="eh"><span class="tp '+t+'">'+ti(t)+'</span><span class="badge">'+inr(ePay(e))+'</span></div><h3>'+esc(e.venue)+'</h3>'+e.workers.map(function(w){return '<p><span>'+esc(w.n)+' '+pl(w.p||t)+' · '+wdesc(w)+'</span><span>'+inr(wpay(e,w))+'</span></p>'}).join("")+(acts?'<div class="acts"><button class="pill" onclick="edit(\''+e.id+'\')">✏️ Edit</button><button class="pill d" onclick="del(\''+e.id+'\')">🗑️ Delete</button></div>':'')+'</div>'}
function wstat(w,m){var rows=[],days=0,hrs=0,pay=0;S.entries.forEach(function(e){if(e.date.slice(0,7)!==m)return;e.workers.forEach(function(x){if(x.n!==w.name)return;var h=x.h>0?Number(x.h):0,a=wpay(e,x);rows.push({date:e.date,venue:e.venue,s:x.s||[],h:h,p:x.p||etype(e),a:a});if(h)hrs+=h;else days+=dys(x.s);pay+=a})});var nts=S.notes.filter(function(x){return x.wid===w.id&&x.date.slice(0,7)===m&&(x.advance||x.note)}).sort(function(a,b){return a.date<b.date?-1:1});return{rows:rows,days:days,hrs:hrs,pay:pay,nts:nts}}
/* ---------- HOME ---------- */
function vHome(){
 var td=today(),l=ents(td),cur=td.slice(0,7),pay=0,days=0,ppl={},money=0,hr=new Date().getHours();
 S.entries.forEach(function(e){if(e.date.slice(0,7)!==cur)return;pay+=ePay(e);e.workers.forEach(function(w){days+=dys(w.s);ppl[w.n]=1})});
 S.notes.forEach(function(x){if(x.date.slice(0,7)===cur)money+=x.advance});
 var h='<div class="gr"><div><p>'+(hr<12?"Good morning":hr<17?"Good afternoon":"Good evening")+' 👋</p><h1>Dashboard</h1></div><span class="st" onclick="load()">'+stt()+' ↻</span></div>';

function run(p,msg){return p.then(function(r){if(r.error){toast(r.error.message);return}toast(msg);return load()})}
function load(){Promise.all([sb.from("workers").select("*"),sb.from("entries").select("*"),sb.from("notes").select("*")]).then(function(r){var bad=r.filter(function(x){return x.error})[0];if(bad){dbErr=1;toast(bad.error.message);render();return}dbErr=0;
 S.workers=r[0].data.map(function(o){return{id:o.id,name:o.name,role:o.role||"",wg:Number(o.wg),wm:Number(o.wm),wh:Number(o.wh||0)}}).sort(function(a,b){return a.name.localeCompare(b.name)});
 S.entries=r[1].data.map(function(o){return{id:o.id,date:o.date,t:o.t,venue:o.venue,workers:o.workers||[]}}).sort(function(a,b){return a.date<b.date?-1:1});
 S.notes=r[2].data.map(function(o){return{id:o.id,date:o.date,wid:o.worker_id,name:o.name,advance:Number(o.advance),note:o.note||""}});ready=7;render()})}

 return h+'<div class="card"><label>Email</label><input id="le" type="email" autocomplete="username" placeholder="you@example.com"><label>Password</label><input id="lp" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key===\'Enter\')login()">'+(loginMsg?'<p style="color:var(--bad);margin:0 0 12px">'+esc(loginMsg)+'</p>':'')+'<button class="btn" onclick="login()">Sign in</button></div>'}
