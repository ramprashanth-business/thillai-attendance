<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Attendance">
<title>Attendance &amp; Salary</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f5f4fb;--card:#fff;--tx:#17142b;--mut:#8a88a0;--ac:#7c3aed;--ac2:#ec4899;--line:#ecebf4;--chip:#f1f0f8;--bad:#e11d48;--ok:#10b981;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a12;--card:#1a1826;--tx:#f5f4fb;--mut:#9a98aa;--line:#2a2838;--chip:#26243a}}
:root[data-theme="dark"]{--bg:#0b0a12;--card:#1a1826;--tx:#f5f4fb;--mut:#9a98aa;--line:#2a2838;--chip:#26243a}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:0 16px 130px;max-width:600px;margin:0 auto}
.gr{display:flex;justify-content:space-between;align-items:flex-end;margin:18px 2px 16px}.gr h1{margin:0;font-size:32px;letter-spacing:-.8px}.gr p{margin:0 0 2px;color:var(--mut);font-size:14px}.st{font-size:11px;color:var(--mut);text-align:right;max-width:140px}
.ab{display:flex;align-items:center;gap:12px;margin:14px 0 16px}.ab h1{margin:0;font-size:24px;letter-spacing:-.5px}.ab p{margin:0;color:var(--mut);font-size:13px}
.back{border:0;background:var(--card);color:var(--ac);font-size:26px;width:44px;height:44px;border-radius:50%;box-shadow:0 2px 10px rgba(80,40,160,.12);line-height:1}
.hero{background:linear-gradient(135deg,#6d28d9,#c026d3 60%,#ec4899);color:#fff;border-radius:28px;padding:22px;margin-bottom:14px;box-shadow:0 14px 34px rgba(124,58,237,.35)}
.hero>span{opacity:.85;font-size:13px;font-weight:600}.hero>b{display:block;font-size:40px;letter-spacing:-1px;margin:2px 0 16px}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hs div{background:rgba(255,255,255,.17);border-radius:16px;padding:10px}.hs b{display:block;font-size:16px}.hs span{font-size:11px;opacity:.88}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(80,40,160,.07);animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card h2,.sheet h2{margin:0 0 12px;font-size:18px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ch h2{margin:0}
label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px}
input{width:100%;font:inherit;color:var(--tx);background:var(--chip);border:0;border-radius:14px;padding:14px;outline:none;margin-bottom:14px;min-width:0}
input:focus{box-shadow:0 0 0 2px var(--ac)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.dc{flex:none;width:54px;border:0;background:var(--chip);color:var(--tx);font:inherit;border-radius:18px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;overflow:hidden}
.dc small{font-size:11px;color:var(--mut);font-weight:600}.dc b{font-size:18px}
.dc.on{background:linear-gradient(160deg,var(--ac),var(--ac2));color:#fff}.dc.on small{color:#fff;opacity:.85}
.dp input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0}
.pks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pk{border:2px solid var(--line);border-radius:20px;padding:16px 10px;text-align:center;font-weight:700;position:relative;transition:.15s}
.pk b{display:block;font-size:30px;margin-bottom:4px}.pk.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--card))}
.cb{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff}.pk.on .cb{background:var(--ac);border-color:var(--ac)}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}.chip{border:0;background:var(--chip);color:var(--tx);font:inherit;font-size:14px;padding:8px 14px;border-radius:999px}
.row{display:flex;gap:8px;margin-bottom:12px}.row input{margin-bottom:0}
.btn{border:0;font:inherit;font-weight:700;border-radius:18px;padding:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;width:100%;font-size:16px}
.btn.g{background:var(--chip);color:var(--tx)}.btn.red{background:var(--bad)}.btn.off{background:var(--mut)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.hd label{margin:0}.hd div{display:flex;gap:6px}
.srch{margin-bottom:10px}
.wk{border-radius:20px;background:var(--chip);margin-bottom:8px;border:2px solid transparent;padding:10px;cursor:pointer;display:flex;align-items:center;gap:10px}
.wk.on{border-color:var(--ok);display:block;cursor:default;background:color-mix(in srgb,var(--ok) 7%,var(--card))}
.wh{display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:10px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.nm{flex:1;min-width:0}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--mut);font-size:12px}
.plus,.x{width:32px;height:32px;border-radius:50%;background:var(--card);color:var(--ac);display:grid;place-items:center;font-size:18px;font-weight:700;flex:none}.x{color:var(--mut);font-size:14px}
.shs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.shs button{border:0;background:var(--card);color:var(--mut);font:inherit;font-size:13px;font-weight:700;padding:11px 2px;border-radius:14px}.shs button.on{background:var(--ac);color:#fff}
.ent{border-top:1px solid var(--line);padding:14px 0}.ent:first-of-type{border-top:0;padding-top:0}
.eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tp{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fef3c7;color:#b45309}.tp.M{background:#ede9fe;color:#6d28d9}.tp.GM{background:#d1fae5;color:#047857}
.badge{font-weight:800;color:var(--ac)}.ent h3{margin:0 0 6px;font-size:17px}
.ent p{margin:3px 0;color:var(--mut);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.nt{background:var(--chip);border-radius:12px;padding:8px 12px;font-size:13px;margin-top:8px}
.acts{display:flex;gap:8px;margin-top:10px}
.pill{border:0;background:var(--chip);color:var(--ac);font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px}.pill.d{color:var(--bad)}.pill.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.empty{text-align:center;color:var(--mut);padding:22px 0}.empty .pill{margin-top:10px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:112px;gap:6px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;color:var(--mut)}.bc span{font-weight:700;color:var(--tx)}
.bc i{width:70%;max-width:28px;border-radius:9px;background:linear-gradient(180deg,var(--ac2),var(--ac))}
.wrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.wrow:first-of-type{border-top:0}.wrow.l{cursor:pointer}
.wrow .r{text-align:right;font-weight:800}
.dr{border-top:1px solid var(--line);padding:12px 0}.dr:first-of-type{border-top:0;padding-top:0}
.dh{display:flex;justify-content:space-between;font-weight:800}.dr p{margin:3px 0 0;color:var(--mut);font-size:13px}
.tr{display:flex;justify-content:space-between;font-weight:800;font-size:18px;border-top:2px solid var(--line);padding-top:12px;margin-top:6px}
.edit{background:#fef3c7;color:#92400e;display:flex;justify-content:space-between;align-items:center}
.sb{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:568px;bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 10px 26px rgba(124,58,237,.45);z-index:5}.sb.off{box-shadow:none}
.bn{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:560px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:30px;padding:8px;box-shadow:0 10px 34px rgba(40,20,90,.2);z-index:6}
.bn:empty{display:none}
.bn button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.bn button i{font-style:normal;font-size:21px}.bn button.on{color:var(--ac)}
.bn .plusb{flex:none;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:32px;font-weight:300;margin:-26px 6px 2px;box-shadow:0 8px 20px rgba(124,58,237,.5);justify-content:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;background:var(--card);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));z-index:21;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}}
.r2{display:flex;gap:10px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}.toast.show{opacity:1}
</style></head><body>
<div id="app"></div><nav class="bn" id="tabs"></nav><div id="md"></div><div class="toast" id="toast"></div>
<script>
var S={entries:[],workers:[],notes:[]},sb=null,user=null,loginMsg="",ready=0,dbErr=0,tab="home",date=today(),month=today().slice(0,7),wdet=null,q="",CB=null,f=newF(),COL=["#7c3aed","#ec4899","#f59e0b","#10b981","#3b82f6","#ef4444"],VAL={H:.5,M:1,N:1},LB={H:"½ Day",M:"☀️ Morning",N:"🌙 Night"},KS=["H","M","N"];
function newF(){return{id:null,g:0,m:1,hall:"",sel:{}}}
function ymd(d){var p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function today(){return ymd(new Date())}
function dt(s){return new Date(s+"T00:00:00")}
function fmt(d){var a=d.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function sd(d){return dt(d).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function ml(m){return dt(m+"-01").toLocaleDateString("en-IN",{month:"long",year:"numeric"})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function inr(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function fd(n){return Number.isInteger(n)?n:n.toFixed(1)}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1800)}
function col(n){var c=0;for(var i=0;i<n.length;i++)c+=n.charCodeAt(i);return COL[c%COL.length]}
function av(n){return '<div class="av" style="background:'+col(n)+'">'+esc(n.charAt(0).toUpperCase())+'</div>'}
function wk(n){return S.workers.filter(function(x){return x.name===n})[0]}
function rate(n,t){var w=wk(n);if(!w)return 0;var g=t.indexOf("G")>-1,m=t.indexOf("M")>-1;return g&&m?Math.max(w.wg,w.wm):g?w.wg:m?w.wm:0}
function etype(e){return e.t||(/godown/i.test(e.venue)?"G":"M")}
function ti(t){return t==="GM"?"🏭 Godown + 🏛️ Mahal":t==="G"?"🏭 Godown":"🏛️ Mahal"}
function hallOf(e){var t=etype(e);return t==="GM"?e.venue.replace(/^Godown \+ /,""):t==="M"?e.venue:""}
function dys(s){return s.reduce(function(n,k){return n+(VAL[k]||0)},0)}
function lbl(s){return KS.filter(function(k){return s.indexOf(k)>-1}).map(function(k){return LB[k]}).join(" + ")}
function ents(d){return S.entries.filter(function(e){return e.date===d})}
function ePay(e){var t=etype(e);return e.workers.reduce(function(n,w){return n+rate(w.n,t)*dys(w.s)},0)}
function nt(d,wid){return S.notes.filter(function(x){return x.date===d&&x.wid===wid})[0]||{advance:0,note:""}}
function nline(x){return '<div class="nt">💬 <b>'+esc(x.name)+'</b>'+(x.advance?' · '+inr(x.advance)+' given':'')+(x.note?' · '+esc(x.note):'')+'</div>'}
function notesHTML(d){return S.notes.filter(function(x){return x.date===d&&(x.advance||x.note)}).map(nline).join("")}
function nTxt(d){var l=S.notes.filter(function(x){return x.date===d&&(x.advance||x.note)});return l.length?"\n\nNotes:\n"+l.map(function(x){return "• "+x.name+(x.advance?": "+inr(x.advance)+" given":"")+(x.note?" – "+x.note:"")}).join("\n"):""}
function dayText(d){var l=ents(d);return "Attendance "+fmt(d)+"\n\n"+l.map(function(e,i){return (i+1)+") "+ti(etype(e))+" – "+e.venue+"\n"+e.workers.map(function(w){return "• "+w.n+" – "+lbl(w.s)+" = "+inr(rate(w.n,etype(e))*dys(w.s))}).join("\n")}).join("\n\n")+nTxt(d)+"\n\nTotal: "+inr(l.reduce(function(n,e){return n+ePay(e)},0))}
function send(t){if(navigator.share){navigator.share({text:t}).catch(function(){})}else{try{navigator.clipboard.writeText(t);toast("Copied")}catch(e){prompt("Copy:",t)}}}
function openM(h){document.getElementById("md").innerHTML='<div class="ov" onclick="closeM()"></div><div class="sheet">'+h+'</div>'}
function closeM(){document.getElementById("md").innerHTML=""}
function confirmM(msg,label,fn){CB=fn;openM('<h2>'+esc(msg)+'</h2><div class="r2"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn red" onclick="var c=CB;closeM();c()">'+label+'</button></div>')}
function hdr(t,s){return '<div class="gr"><div><p>'+s+'</p><h1>'+t+'</h1></div></div>'}
function stt(){return dbErr?'⚠️ Cannot reach database':ready<7?'⏳ Loading…':'☁️ Synced'}
function entryHTML(e,acts){var t=etype(e);return '<div class="ent"><div class="eh"><span class="tp '+t+'">'+ti(t)+'</span><span class="badge">'+inr(ePay(e))+'</span></div><h3>'+esc(e.venue)+'</h3>'+e.workers.map(function(w){return '<p><span>'+esc(w.n)+' · '+lbl(w.s)+'</span><span>'+inr(rate(w.n,t)*dys(w.s))+'</span></p>'}).join("")+(acts?'<div class="acts"><button class="pill" onclick="edit(\''+e.id+'\')">✏️ Edit</button><button class="pill d" onclick="del(\''+e.id+'\')">🗑️ Delete</button></div>':'')+'</div>'}
function wstat(w,m){var rows=[],days=0,pay=0;S.entries.forEach(function(e){if(e.date.slice(0,7)!==m)return;e.workers.forEach(function(x){if(x.n!==w.name)return;var d=dys(x.s),a=d*rate(w.name,etype(e));rows.push({date:e.date,venue:e.venue,s:x.s,d:d,a:a});days+=d;pay+=a})});var nts=S.notes.filter(function(x){return x.wid===w.id&&x.date.slice(0,7)===m&&(x.advance||x.note)}).sort(function(a,b){return a.date<b.date?-1:1});return{rows:rows,days:days,pay:pay,nts:nts}}
/* ---------- HOME ---------- */
function vHome(){
 var td=today(),l=ents(td),cur=td.slice(0,7),pay=0,days=0,ppl={},money=0,hr=new Date().getHours();
 S.entries.forEach(function(e){if(e.date.slice(0,7)!==cur)return;pay+=ePay(e);e.workers.forEach(function(w){days+=dys(w.s);ppl[w.n]=1})});
 S.notes.forEach(function(x){if(x.date.slice(0,7)===cur)money+=x.advance});
 var h='<div class="gr"><div><p>'+(hr<12?"Good morning":hr<17?"Good afternoon":"Good evening")+' 👋</p><h1>Dashboard</h1></div><span class="st">'+stt()+'</span></div>';
 h+='<div class="hero"><span>'+ml(cur)+' · salary</span><b>'+inr(pay)+'</b><div class="hs"><div><b>'+fd(days)+'</b><span>Days worked</span></div><div><b>'+Object.keys(ppl).length+'</b><span>Workers</span></div><div><b>'+inr(money)+'</b><span>Money noted</span></div></div></div>';
 var arr=[],mx=1;for(var k=6;k>=0;k--){var d=new Date();d.setDate(d.getDate()-k);var p={};ents(ymd(d)).forEach(function(e){e.workers.forEach(function(w){p[w.n]=1})});var c=Object.keys(p).length;arr.push({d:d,c:c});mx=Math.max(mx,c)}
 h+='<div class="card"><div class="ch"><h2>Last 7 days</h2><span class="st">workers present</span></div><div class="bars">'+arr.map(function(a){return '<div class="bc"><span>'+(a.c||"")+'</span><i style="height:'+(a.c?Math.max(14,a.c/mx*70):5)+'px"></i>'+a.d.toLocaleDateString("en-IN",{weekday:"short"}).slice(0,2)+'</div>'}).join("")+'</div></div>';
 var pr={};l.forEach(function(e){e.workers.forEach(function(w){pr[w.n]=1})});
 h+='<div class="card"><div class="ch"><h2>Today · '+Object.keys(pr).length+' present</h2><button class="pill p" onclick="openAdd()">＋ Add</button></div>'+(l.length?l.map(function(e){return entryHTML(e,1)}).join("")+notesHTML(td):'<div class="empty">No attendance added today<br><button class="pill p" onclick="openAdd()">＋ Add attendance</button></div>')+'</div>';
 var top5=S.workers.map(function(w){return{w:w,s:wstat(w,cur)}}).filter(function(x){return x.s.days>0}).sort(function(a,b){return b.s.pay-a.s.pay}).slice(0,5);
 if(top5.length)h+='<div class="card"><div class="ch"><h2>This month</h2><button class="pill" onclick="go(\'sal\')">All →</button></div>'+top5.map(function(x){return '<div class="wrow l" onclick="wdet=\''+x.w.id+'\';month=\''+cur+'\';tab=\'sal\';render();scrollTo(0,0)">'+av(x.w.name)+'<div class="nm"><b>'+esc(x.w.name)+'</b><small>'+fd(x.s.days)+' days</small></div><div class="r">'+inr(x.s.pay)+'</div></div>'}).join("")+'</div>';
 return h}
/* ---------- ADD ---------- */
function pt(){return (f.g?"G":"")+(f.m?"M":"")}
function dlabel(){return (date===today()?"Today · ":"")+dt(date).toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short",year:"numeric"})}
function wl(){var qq=q.trim().toLowerCase(),T=pt(),h="",n=0;
 S.workers.forEach(function(w,i){if(qq&&w.name.toLowerCase().indexOf(qq)<0)return;n++;var x=f.sel[w.name];
  if(!x){h+='<div class="wk" onclick="tog('+i+')">'+av(w.name)+'<div class="nm"><b>'+esc(w.name)+'</b><small>'+(w.wg||w.wm?'🏭 '+inr(w.wg)+' · 🏛️ '+inr(w.wm):'⚠️ Set salary in Workers tab')+'</small></div><span class="plus">＋</span></div>';return}
  var d=dys(x.s);
  h+='<div class="wk on"><div class="wh" onclick="tog('+i+')"><div class="av" style="background:#10b981">✓</div><div class="nm"><b>'+esc(w.name)+'</b><small>'+fd(d)+' day · '+(T?inr(rate(w.name,T)*d):'pick place first')+'</small></div><span class="x">✕</span></div><div class="shs">'+KS.map(function(k){return '<button class="'+(x.s.indexOf(k)>-1?'on':'')+'" onclick="sh('+i+',\''+k+'\')">'+LB[k]+'</button>'}).join("")+'</div><div class="row"><input type="number" inputmode="numeric" placeholder="💸 Money ₹" value="'+esc(x.amt||"")+'" style="max-width:118px" oninput="f.sel[S.workers['+i+'].name].amt=this.value"><input placeholder="Note (if sent money)" value="'+esc(x.note||"")+'" oninput="f.sel[S.workers['+i+'].name].note=this.value"></div></div>'});
 return n?h:'<div class="empty">No worker found</div>'}
function vAdd(){
 var ks=Object.keys(f.sel),T=pt(),cp=0;ks.forEach(function(n){cp+=dys(f.sel[n].s)*rate(n,T)});
 var h='<div class="ab"><button class="back" onclick="closeAdd()">‹</button><div><h1>'+(f.id?'Edit attendance':'Add attendance')+'</h1><p>'+dlabel()+'</p></div></div>';
